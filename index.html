<main class="app">
<section id="home">

<div class="menu">

<section id="detail" class="hidden">

</section>

<section id="stats" class="hidden">
<header><button class="back" onclick="goHome()">‹</button><h2>Estadísticas</h2></header>
<div id="statsGrid" class="stats-grid"></div>
</section>

<section id="settings" class="hidden">
<header><button class="back" onclick="goHome()">‹</button><h2>Configuración</h2></header>
<div class="settings">
<button class="secondary" onclick="exportCSV()">📤 Exportar biblioteca en CSV</button>
<button class="secondary" onclick="exportJSON()">💾 Crear copia de seguridad</button>
<label class="secondary" style="display:block;text-align:center;cursor:pointer">📥 Importar copia de seguridad<input class="hidden" type="file" accept=".json,application/json" onchange="importJSON(this)"></label>
<button class="danger" onclick="resetLibrary()">Restaurar Excel original</button>
</div>
</section>
</main>
